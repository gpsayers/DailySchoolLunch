name: Daily SMS

on:
  workflow_dispatch:
    inputs:
      delivery_mode:
        description: '1=email-to-SMS, 2=TextBee, 3=no-op test'
        required: false
        default: '3'

jobs:
  send_sms:
    runs-on: ubuntu-latest

    env:
      DELIVERY_MODE: ${{ github.event.inputs.delivery_mode }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
      TEXTBEE_API_KEY: ${{ secrets.TEXTBEE_API_KEY }}

    steps:
      - name: Validate delivery configuration
        shell: bash
        run: |
          if [ "${DELIVERY_MODE}" = "1" ]; then
            if [ -z "${SMTP_USERNAME}" ] || [ -z "${SMTP_PASSWORD}" ] || [ -z "${SMTP_FROM}" ] || [ -z "${RECIPIENT_PHONE_NUMBER}" ]; then
              echo "Missing one or more required secrets for email-to-SMS: SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, RECIPIENT_PHONE_NUMBER"
              exit 1
            fi
          elif [ "${DELIVERY_MODE}" = "2" ]; then
            if [ -z "${TEXTBEE_API_KEY}" ] || [ -z "${RECIPIENT_PHONE_NUMBER}" ]; then
              echo "Missing one or more required secrets for TextBee: TEXTBEE_API_KEY, RECIPIENT_PHONE_NUMBER"
              exit 1
            fi
          elif [ "${DELIVERY_MODE}" = "3" ]; then
            echo "DELIVERY_MODE=3 selected: no-op test mode. No real message will be sent."
            exit 0
          else
            echo "DELIVERY_MODE must be 1 (email-to-SMS), 2 (TextBee), or 3 (no-op test mode)"
            exit 1
          fi

      - name: Send lunch SMS
        shell: bash
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

          python3 - <<'PY'
          import os
          import re
          import smtplib
          from datetime import date
          from email.message import EmailMessage
          from playwright.sync_api import sync_playwright

          menu_url = "https://schools.mealviewer.com/school/LibertyMiddleSc"

          with sync_playwright() as playwright:
            browser = playwright.chromium.launch()
            page = browser.new_page()
            page.goto(menu_url, wait_until="networkidle")

            accept_button = page.get_by_text("I ACCEPT", exact=True)
            if accept_button.count():
              accept_button.click()

            lunch_tab = page.get_by_text("Lunch", exact=True)
            if lunch_tab.count():
              page.locator("#menu-block").select_option(label="Lunch")

            page.locator(".calendar-grid-item").filter(
                has=page.locator("text=ENTREE CHOICES")
            ).first.wait_for(timeout=10000)
            page.wait_for_timeout(1000)
            day_number = str(date.today().day)
            menu = page.evaluate(
                """
                (dayNumber) => {
                  const today = document.querySelector('.day.today');
                  const cell = today?.closest('.calendar-grid-item');
                  const text = cell?.innerText?.trim() || '';
                  return text.includes(dayNumber) && /ENTREE CHOICES/i.test(text) && /SIDES/i.test(text)
                    ? text
                    : '';
                }
                """,
                day_number,
            )
            browser.close()

            if not menu:
              raise RuntimeError(f"Could not find a lunch menu cell for day {day_number}")

            menu_lines = []
            for line in menu.splitlines():
              line = " ".join(line.split())
              if line and line != day_number and line.upper() != "ENTREE CHOICES":
                menu_lines.append(line)
            menu = "\n".join(dict.fromkeys(menu_lines))

            menu_lines = menu.splitlines()
            sides_index = next(
              (index for index, line in enumerate(menu_lines) if line.upper() == "SIDES"),
              len(menu_lines),
            )
            sections = [menu_lines[:sides_index], menu_lines[sides_index:]]
            sections = [section for section in sections if section]

            messages = []
            for section in sections:
              current_message = []
              current_length = 0
              for line in section:
                line_length = len(line) + (1 if current_message else 0)
                if current_message and current_length + line_length > 120:
                  messages.append("\n".join(current_message))
                  current_message = []
                  current_length = 0
                current_message.append(line)
                current_length += len(line) + (1 if len(current_message) > 1 else 0)
              if current_message:
                messages.append("\n".join(current_message))

          delivery_mode = os.environ.get("DELIVERY_MODE", "1").strip()
          raw_numbers = [value.strip() for value in os.environ.get("RECIPIENT_PHONE_NUMBER", "").split(",") if value.strip()]

          if not raw_numbers:
            raise ValueError("RECIPIENT_PHONE_NUMBER must contain at least one phone number")

          phone_numbers = []
          for value in raw_numbers:
            digits = re.sub(r"\D", "", value)
            if len(digits) != 10:
              raise ValueError(
                "RECIPIENT_PHONE_NUMBER must contain comma-separated 10-digit phone numbers"
              )
            phone_numbers.append(digits)

          if delivery_mode == "1":
            smtp_host = os.environ["SMTP_HOST"]
            smtp_port = int(os.environ["SMTP_PORT"])
            username = os.environ["SMTP_USERNAME"]
            password = os.environ["SMTP_PASSWORD"]
            from_addr = os.environ["SMTP_FROM"]
            recipients = [number + "@vtext.com" for number in phone_numbers]

            with smtplib.SMTP(smtp_host, smtp_port) as server:
              server.starttls()
              server.login(username, password)
              for recipient in recipients:
                for message_number, message_body in enumerate(messages, start=1):
                  msg = EmailMessage()
                  header = f"Lunch Menu {message_number}/{len(messages)}"
                  msg["Subject"] = header
                  msg["From"] = from_addr
                  msg["To"] = recipient
                  msg.set_content(message_body)
                  server.send_message(msg)

            print(f"Sent {len(messages)} SMS part(s) to {len(recipients)} recipient(s) via email-to-SMS:\n{menu}")
          elif delivery_mode == "2":
            api_key = os.environ.get("TEXTBEE_API_KEY", "").strip()
            if not api_key:
              raise ValueError("TEXTBEE_API_KEY is required when DELIVERY_MODE=2")

            import json
            import urllib.request

            sent_count = 0
            for phone in phone_numbers:
              for message_number, message_body in enumerate(messages, start=1):
                payload = {
                  "to": phone,
                  "message": f"Lunch Menu {message_number}/{len(messages)}\n{message_body}",
                  "countryCode": "1",
                }
                request = urllib.request.Request(
                  "https://api.textbee.dev/api/v1/send",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                    "Content-Type": "application/json",
                    "X-API-Key": api_key,
                  },
                  method="POST",
                )
                with urllib.request.urlopen(request, timeout=30) as response:
                  response.read()
                sent_count += 1

            print(f"Sent {sent_count} TextBee message(s) to {len(phone_numbers)} recipient(s)")
          elif delivery_mode == "3":
            print(f"DELIVERY_MODE=3 selected: test mode only. No message was sent.\nPreview: {menu}")
          else:
            raise ValueError("DELIVERY_MODE must be 1 (email-to-SMS), 2 (TextBee), or 3 (no-op test mode)")
          PY
