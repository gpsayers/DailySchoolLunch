name: Daily SMS

on:
  schedule:
    - cron: '0 13 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  send_sms:
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
      MESSAGE_BODY: ${{ vars.DAILY_SMS_MESSAGE != '' && vars.DAILY_SMS_MESSAGE || 'Good morning! This is your daily reminder from DailySchoolLunch.' }}

    steps:
      - name: Validate email-to-SMS configuration
        shell: bash
        run: |
          if [ -z "${SMTP_USERNAME}" ] || [ -z "${SMTP_PASSWORD}" ] || [ -z "${SMTP_FROM}" ] || [ -z "${RECIPIENT_PHONE_NUMBER}" ]; then
            echo "Missing one or more required secrets: SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, RECIPIENT_PHONE_NUMBER"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            local_hour="$(TZ=America/Chicago date +%H)"
            if [ "$local_hour" != "08" ] && [ "$local_hour" != "09" ]; then
              echo "Skipping scheduled run outside 8:00-9:00 AM Central time."
              exit 0
            fi
          fi

      - name: Send SMS via Verizon email gateway
        shell: bash
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

          python3 - <<'PY'
          import os
          import re
          import smtplib
          from datetime import date
          from email.message import EmailMessage
          from playwright.sync_api import sync_playwright

          menu_url = "https://schools.mealviewer.com/school/LibertyMiddleSc"

          with sync_playwright() as playwright:
            browser = playwright.chromium.launch()
            page = browser.new_page()
            page.goto(menu_url, wait_until="networkidle")

            accept_button = page.get_by_text("I ACCEPT", exact=True)
            if accept_button.count():
              accept_button.click()

            lunch_tab = page.get_by_text("Lunch", exact=True)
            if lunch_tab.count():
              page.locator("#menu-block").select_option(label="Lunch")

            page.locator(".calendar-grid-item").filter(
                has=page.locator("text=ENTREE CHOICES")
            ).first.wait_for(timeout=10000)
            page.wait_for_timeout(1000)
            day_number = str(date.today().day)
            menu = page.evaluate(
                """
                (dayNumber) => {
                  const today = document.querySelector('.day.today');
                  const cell = today?.closest('.calendar-grid-item');
                  const text = cell?.innerText?.trim() || '';
                  return text.includes(dayNumber) && /ENTREE CHOICES/i.test(text) && /SIDES/i.test(text)
                    ? text
                    : '';
                }
                """,
                day_number,
            )
            browser.close()

            if not menu:
              raise RuntimeError(f"Could not find a lunch menu cell for day {day_number}")

            menu_lines = []
            for line in menu.splitlines():
              line = " ".join(line.split())
              if line and line != day_number and line.upper() != "ENTREE CHOICES":
                menu_lines.append(line)
            menu = "\n".join(dict.fromkeys(menu_lines))

            menu_lines = menu.splitlines()
            sides_index = next(
              (index for index, line in enumerate(menu_lines) if line.upper() == "SIDES"),
              len(menu_lines),
            )
            sections = [menu_lines[:sides_index], menu_lines[sides_index:]]
            sections = [section for section in sections if section]

            messages = []
            for section in sections:
              current_message = []
              current_length = 0
              for line in section:
                line_length = len(line) + (1 if current_message else 0)
                if current_message and current_length + line_length > 120:
                  messages.append("\n".join(current_message))
                  current_message = []
                  current_length = 0
                current_message.append(line)
                current_length += len(line) + (1 if len(current_message) > 1 else 0)
              if current_message:
                messages.append("\n".join(current_message))

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          from_addr = os.environ["SMTP_FROM"]
          phone_numbers = [
            re.sub(r"\D", "", value)
            for value in os.environ["RECIPIENT_PHONE_NUMBER"].split(",")
            if value.strip()
          ]
          invalid_numbers = [number for number in phone_numbers if len(number) != 10]
          if not phone_numbers or invalid_numbers:
            raise ValueError(
              "RECIPIENT_PHONE_NUMBER must contain comma-separated 10-digit phone numbers"
            )
          recipients = [number + "@vtext.com" for number in phone_numbers]

          with smtplib.SMTP(smtp_host, smtp_port) as server:
            server.starttls()
            server.login(username, password)
            for recipient in recipients:
              for message_number, message_body in enumerate(messages, start=1):
                msg = EmailMessage()
                header = f"Lunch Menu {message_number}/{len(messages)}"
                msg["Subject"] = header
                msg["From"] = from_addr
                msg["To"] = recipient
                msg.set_content(message_body)
                server.send_message(msg)

          print(f"Sent {len(messages)} SMS part(s) to {len(recipients)} recipient(s):\n{menu}")
          PY
