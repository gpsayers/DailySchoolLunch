name: Daily SMS

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send_sms:
    runs-on: ubuntu-latest

    env:
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      RECIPIENT_PHONE_NUMBER: ${{ secrets.RECIPIENT_PHONE_NUMBER }}
      MESSAGE_BODY: ${{ vars.DAILY_SMS_MESSAGE != '' && vars.DAILY_SMS_MESSAGE || 'Good morning! This is your daily reminder from DailySchoolLunch.' }}

    steps:
      - name: Validate email-to-SMS configuration
        shell: bash
        run: |
          if [ -z "${SMTP_USERNAME}" ] || [ -z "${SMTP_PASSWORD}" ] || [ -z "${SMTP_FROM}" ] || [ -z "${RECIPIENT_PHONE_NUMBER}" ]; then
            echo "Missing one or more required secrets: SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, RECIPIENT_PHONE_NUMBER"
            exit 1
          fi

      - name: Send SMS via Verizon email gateway
        shell: bash
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

          python3 - <<'PY'
          import os
          import smtplib
          from datetime import date
          from email.message import EmailMessage
          from playwright.sync_api import sync_playwright

          menu_url = "https://schools.mealviewer.com/school/LibertyMiddleSc"

          with sync_playwright() as playwright:
            browser = playwright.chromium.launch()
            page = browser.new_page()
            page.goto(menu_url, wait_until="networkidle")

            accept_button = page.get_by_text("I ACCEPT", exact=True)
            if accept_button.count():
              accept_button.click()

            page.wait_for_timeout(2000)
            day_number = str(date.today().day)
            menu = page.evaluate(
                """
                (dayNumber) => {
                  const isVisible = (element) => {
                    const style = window.getComputedStyle(element);
                    return style.display !== 'none' && style.visibility !== 'hidden';
                  };
                  const dayElements = [...document.querySelectorAll('*')].filter(
                    (element) => isVisible(element) && element.innerText?.trim() === dayNumber
                  );
                  const cells = [];
                  for (const dayElement of dayElements) {
                    let candidate = dayElement;
                    for (let level = 0; level < 7 && candidate; level += 1) {
                      const text = candidate.innerText?.trim() || '';
                      if (/ENTREE CHOICES/i.test(text) && /SIDES/i.test(text)) {
                        cells.push(text);
                        break;
                      }
                      candidate = candidate.parentElement;
                    }
                  }
                  return cells.sort((left, right) => left.length - right.length)[0] || '';
                }
                """,
                day_number,
            )
            browser.close()

          if not menu:
                raise RuntimeError(f"Could not find a lunch menu cell for day {day_number}")

            menu_lines = []
            for line in menu.splitlines():
                line = " ".join(line.split())
                if line and line != day_number:
                    menu_lines.append(line)
            menu = "\n".join(dict.fromkeys(menu_lines))

          smtp_host = os.environ["SMTP_HOST"]
          smtp_port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          from_addr = os.environ["SMTP_FROM"]
          recipient = os.environ["RECIPIENT_PHONE_NUMBER"] + "@vtext.com"

          msg = EmailMessage()
          msg["Subject"] = f"Lunch Menu - {date.today().isoformat()}"
          msg["From"] = from_addr
          msg["To"] = recipient
          msg.set_content(menu)

          with smtplib.SMTP(smtp_host, smtp_port) as server:
            server.starttls()
            server.login(username, password)
            server.send_message(msg)

          print(f"SMS email sent to {recipient} with menu:\n{menu}")
          PY
